<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>REPORTE DE ERRORES</title>
<style>
body { font-family: Arial; margin: 40px; background-color: #C9C9C9 }
h1 { text-align: center; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 3px solid #333; padding: 8px; text-align: center; }
th { background-color: black; color: white; font-weight: bold;}
td: nth-child(1) {text-align: left;}
</style>
</head>
<body>
<h1>REPORTE DE ERRORES</h1>
<table>
<tr>
<th>Lexema</th>
<th>Tipo de Error</th>
<th>Fila</th>
<th>Columna</th>
</tr>
<tr>
<td>@desconocida</td>
<td>Directiva no reconocida</td>
<td>7</td>
<td>1</td>
</tr>
<tr>
<td>#</td>
<td>Caracter no reconocido</td>
<td>8</td>
<td>1</td>
</tr>
<tr>
<td>$</td>
<td>Caracter no reconocido</td>
<td>9</td>
<td>1</td>
</tr>
<tr>
<td>%</td>
<td>Caracter no reconocido</td>
<td>10</td>
<td>1</td>
</tr>
<tr>
<td>"Esta cadena no se cierra</td>
<td>Cadena sin cerrar</td>
<td>11</td>
<td>1</td>
</tr>
<table>
</body>
</html>
